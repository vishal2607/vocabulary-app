version: 1
frontend:
  phases:
    preBuild:
      commands:
        - ls -la
        - test -d frontend && cd frontend || echo "Already in frontend"
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: frontend/dist
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/*
